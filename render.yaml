services:
  - type: web
    name: jokerai-api
    runtime: ruby
    plan: free
    region: frankfurt
    rootDir: api
    buildCommand: bundle install && bundle exec rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /api/health
    domains:
      - api-jokerai.abdulsametok.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jokerai-db
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SOLID_QUEUE_IN_PUMA
        value: "1"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: JOB_THREADS
        value: "2"
      - key: CORS_ORIGINS
        value: https://jokerai.abdulsametok.com,http://localhost:3000
      - key: ALLOWED_HOSTS
        value: api-jokerai.abdulsametok.com,.onrender.com
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: jokerai-db
    plan: free
    region: frankfurt
    databaseName: jokerai
    user: jokerai
